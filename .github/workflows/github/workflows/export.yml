
name: export-solution
on:
  workflow_dispatch:
env:
  SOLUTION_NAME: PowerPlatformPipelines

jobs:
  export:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/powerplatform-actions/actions-install@v1
      - uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ secrets.ENV_URL }}
          app-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          tenant-id: ${{ secrets.TENANT_ID }}
          solution-name: ${{ env.SOLUTION_NAME }}
          solution-output-file: out/${{ env.SOLUTION_NAME }}.zip
          managed: false
      - uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: out/${{ env.SOLUTION_NAME }}.zip
          solution-folder: solutions/${{ env.SOLUTION_NAME }}
          solution-type: Unmanaged
          overwrite-files: true
      - uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
            solution-folder: solutions/${{ env.SOLUTION_NAME }}
            solution-target-folder: solutions/${{ env.SOLUTION_NAME }}
            repo-token: ${{ secrets.GITHUB_TOKEN }}
            allow-empty-commit: true

          
